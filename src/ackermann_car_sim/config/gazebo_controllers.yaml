controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    reference_timeout: 0.60
    front_steering: true
    open_loop: false
    position_feedback: false
    use_stamped_vel: true
    velocity_rolling_window_size: 10
    reduce_wheel_speed_until_steering_reached: true

    # Right wheel first: the controller computes [right, left] commands.
    rear_wheels_names: [rear_right_wheel_joint, rear_left_wheel_joint]
    front_wheels_names: [front_right_steer_joint, front_left_steer_joint]

    wheelbase: 0.65142
    front_wheel_track: 0.584
    rear_wheel_track: 0.584
    front_wheels_radius: 0.164
    rear_wheels_radius: 0.164

    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
    publish_rate: 50.0

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]
